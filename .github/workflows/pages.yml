name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      # A pasta src/ já é o site completo (index.html, projetos.html, style.css e assets/)
      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: src

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
