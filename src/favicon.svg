<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Círculo preto, no mesmo estilo dos botões das redes -->
  <circle cx="32" cy="32" r="32" fill="#000000"/>
  <!-- Iniciais "LG" em branco; favicons em SVG não carregam fontes da web, por isso há fontes de reserva -->
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-weight="800" font-size="28" letter-spacing="-1" fill="#FFFFFF">LG</text>
</svg>
